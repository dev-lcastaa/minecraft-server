name: minecraft-forge

services:
  minecraft:
    image: ${MINECRAFT_IMAGE:-minecraft-forge:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EULA: ${EULA:?Set EULA=TRUE only after accepting the Minecraft EULA}
      FORGE_VERSION: ${FORGE_VERSION:-recommended}
      MAX_PLAYERS: "2"
      MEMORY: "12G"
      USE_AIKAR_FLAGS: "TRUE"
      JVM_XX_OPTS: "-XX:+UseTransparentHugePages"
      JAVA_TOOL_OPTIONS: "-Xlog:gc*,safepoint:file=/data/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=20M"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:?Set a strong RCON_PASSWORD outside source control}
      CFG_RCON_PASSWORD: ${RCON_PASSWORD:?Set a strong RCON_PASSWORD outside source control}
    ports:
      - "25565:25565"
      - "24454:24454/udp"
      - "${RCON_BIND_IP:-192.168.1.208}:25575:25575"
    volumes:
      - minecraft-data:/data
    restart: unless-stopped
    mem_limit: 16g
    memswap_limit: 18g # Total RAM + swap: allows up to 2 GiB of swap.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 10

volumes:
  minecraft-data:
    name: minecraft-forge-data

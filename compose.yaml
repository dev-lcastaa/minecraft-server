name: minecraft-forge

services:
  minecraft:
    image: ${MINECRAFT_IMAGE:-minecraft-forge:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EULA: ${EULA:?Set EULA=TRUE only after accepting the Minecraft EULA}
      FORGE_VERSION: ${FORGE_VERSION:-recommended}
      MEMORY: "14G"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:?Set a strong RCON_PASSWORD outside source control}
      CFG_RCON_PASSWORD: ${RCON_PASSWORD:?Set a strong RCON_PASSWORD outside source control}
    ports:
      - "25565:25565"
      - "${RCON_BIND_IP:-192.168.1.208}:25575:25575"
    volumes:
      - minecraft-data:/data
    restart: unless-stopped
    mem_limit: 16g
    memswap_limit: 16g
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 10

  chunky-scheduler:
    image: ${MINECRAFT_IMAGE:-minecraft-forge:local}
    entrypoint: ["/usr/local/bin/chunky-scheduler.sh"]
    environment:
      RCON_HOST: minecraft
      RCON_PASSWORD: ${RCON_PASSWORD:?Set a strong RCON_PASSWORD outside source control}
      CHUNKY_RADIUS: "15000"
      CHUNKY_MIN_FREE_GB: "20"
    volumes:
      - minecraft-data:/data
    depends_on:
      - minecraft
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      disable: true

volumes:
  minecraft-data:
    name: minecraft-forge-data
